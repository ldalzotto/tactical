name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # cmake, clang/lld, and a version-matched LLVM 22 (for coverage) are
      # installed on demand by server/setup-toolchain.js, invoked from
      # build.js/coverage.js as part of the npm scripts below.
      - name: Run tests
        run: npm run test
