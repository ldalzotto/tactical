name: Build and Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
  pull_request:
  workflow_dispatch:

# Deploys via a plain push to the gh-pages branch (peaceiris/actions-gh-pages),
# not the actions/deploy-pages API -- so this only needs push access to the
# repo, not the pages/id-token permissions that method requires. Repo Pages
# source must be set to "Deploy from a branch: gh-pages / (root)".
permissions:
  contents: write
  pull-requests: write # deploy-preview comments the preview URL on the PR

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Production deploys wait for workflow_run (Test succeeding on
    # master); PR previews build straight off pull_request instead, since
    # workflow_run ALWAYS runs the workflow file from the default branch,
    # never the PR's -- a preview-deploy change made only on a PR branch
    # would never take effect for that PR's own preview otherwise.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default -- pin to
          # the commit Test actually ran against. pull_request already
          # checks out the PR's own merge ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cmake, clang, and lld are installed on demand by
      # server/setup-toolchain.js, invoked from build.js as part of the
      # npm scripts below.
      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist

  deploy-production:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      - name: Deploy site root to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Preserves preview/ subdirectories from open PRs -- only files
          # under dist/ are added/overwritten at the root.
          keep_files: true

  deploy-preview:
    # Every push to an open PR rebuilds and overwrites its own preview/
    # folder. Not gated on the separate Test workflow -- previews are for
    # visual review, not a merge gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      # Branch names are sanitized to [A-Za-z0-9-] so a crafted branch name
      # can't escape the preview/ directory or inject path segments.
      - name: Compute preview path
        id: branch
        run: |
          safe_branch=$(echo "${{ github.head_ref }}" | sed 's/[^A-Za-z0-9-]/-/g')
          echo "dir=preview/$safe_branch" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ steps.branch.outputs.dir }}
          keep_files: true

      # Upserts one comment (matched by the hidden marker) instead of
      # posting a new one on every push to the PR.
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview-url -->';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/${{ steps.branch.outputs.dir }}/`;
            const body = `${marker}\n🔍 Preview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
