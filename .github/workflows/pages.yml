name: Build and Deploy to GitHub Pages

# Publishes the master build to the gh-pages branch's root. Uses keep_files
# so this never wipes out the pr-preview/pr-<number>/ folders that
# pr-preview.yml maintains on the same branch -- both workflows publish to
# gh-pages, just to different paths.
on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CMake and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
