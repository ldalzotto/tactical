name: Build and Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
  workflow_dispatch:

# Deploys via a plain push to the gh-pages branch (peaceiris/actions-gh-pages),
# not the actions/deploy-pages API -- so this only needs push access to the
# repo, not the pages/id-token permissions that method requires. Repo Pages
# source must be set to "Deploy from a branch: gh-pages / (root)".
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      is_master_push: ${{ steps.branch.outputs.is_master_push }}
      preview_dir: ${{ steps.branch.outputs.preview_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run always checks out the workflow file's own ref (the
          # default branch) by default -- pin to the commit Test actually
          # ran against so a PR's Pages build reflects that PR, not master.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cmake, clang, and lld are installed on demand by
      # server/setup-toolchain.js, invoked from build.js as part of the
      # npm scripts below.
      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist

      # Master's push build deploys to the site root; anything else (PR
      # branches, other branch pushes) deploys to preview/<branch>/,
      # alongside the live site instead of replacing it. Branch names are
      # sanitized to [A-Za-z0-9-] so a crafted branch name can't escape the
      # preview/ directory or inject path segments.
      - name: Determine deploy target
        id: branch
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          event="${{ github.event.workflow_run.event }}"
          if [ "$event" = "push" ] && [ "$branch" = "master" ]; then
            echo "is_master_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_master_push=false" >> "$GITHUB_OUTPUT"
          fi
          safe_branch=$(echo "$branch" | sed 's/[^A-Za-z0-9-]/-/g')
          echo "preview_dir=preview/$safe_branch" >> "$GITHUB_OUTPUT"

  deploy-production:
    if: needs.build.outputs.is_master_push == 'true'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      - name: Deploy site root to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Preserves preview/ subdirectories from other branches -- only
          # files under dist/ are added/overwritten at the root.
          keep_files: true

  deploy-preview:
    if: needs.build.outputs.is_master_push == 'false' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ needs.build.outputs.preview_dir }}
          keep_files: true
